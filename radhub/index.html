<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadHub Pro - Tra cứu Chẩn đoán Hình ảnh</title>
    <style>
        :root { --primary: #1e40af; --primary-hover: #1d4ed8; --bg: #f8fafc; --text: #0f172a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); }
        header { background: var(--primary); color: white; padding: 1.5rem 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 5px 0 0 0; opacity: 0.8; font-size: 0.9rem; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .search-box { display: flex; gap: 10px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .search-box input { flex: 3; padding: 12px 15px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .search-box select { flex: 1; padding: 12px 15px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; background: white; }
        .btn-search { flex: 1; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-search:hover { background: var(--primary-hover); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; border: 1px solid #e2e8f0; padding: 18px; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .badge { display: inline-block; background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 8px; width: fit-content; }
        .card-title { font-size: 15px; font-weight: bold; margin: 0 0 10px 0; color: #1e293b; line-height: 1.4; }
        .card-meta { font-size: 11px; color: #94a3b8; margin-top: 12px; font-weight: 500; }

        /* Modal Viewer */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 800px; max-height: 85vh; border-radius: 12px; overflow-y: auto; padding: 30px; position: relative; }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 24px; font-weight: bold; cursor: pointer; color: #64748b; }
        .btn-pubmed { display: inline-block; margin-top: 15px; background: #0284c7; color: white; padding: 10px 18px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
        
        .status-msg { grid-column: 1/-1; text-align: center; color: #64748b; font-weight: bold; padding: 40px 0; }
    </style>
</head>
<body>

<header>
    <h1>RadHub Pro</h1>
    <p>Hệ thống Tra cứu Bài báo Y khoa Chẩn đoán Hình ảnh Trực tiếp từ PubMed</p>
</header>

<div class="container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Nhập từ khóa tiếng Anh (VD: renal tumour, stroke, LI-RADS...)" value="renal tumour" onkeypress="handleKeyPress(event)">
        <select id="modalityFilter">
            <option value="">Tất cả Phương tiện</option>
            <option value="CT">CT</option>
            <option value="MRI">MRI</option>
            <option value="Ultrasound">Ultrasound</option>
            <option value="Radiography">X-Ray</option>
        </select>
        <button class="btn-search" onclick="searchPubMed()">🔍 Tìm kiếm Live</button>
    </div>

    <div class="grid" id="caseGrid"></div>
</div>

<div class="modal" id="caseModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <span class="badge" id="modalJournal">PubMed</span>
        <h2 id="modalTitle" style="margin-top: 10px; color: #0f172a; font-size: 18px;"></h2>
        <p id="modalAuthors" style="font-size: 13px; color: #64748b; font-style: italic;"></p>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">
        <h4 style="color: var(--primary); margin-bottom: 8px;">Tóm tắt (Abstract):</h4>
        <p id="modalAbstract" style="font-size: 14px; line-height: 1.6; color: #334155; text-align: justify;"></p>
        <a id="modalLink" href="#" target="_blank" class="btn-pubmed">🔗 Xem bài gốc trên PubMed</a>
    </div>
</div>

<script>
// Thông số bắt buộc khi làm việc với NCBI PubMed API
const NCBI_PARAMS = "&tool=RadHubApp&email=contact@radhub.org";
let articlesData = [];

async function searchPubMed() {
    const keyword = document.getElementById('searchInput').value.trim();
    const modality = document.getElementById('modalityFilter').value;
    const grid = document.getElementById('caseGrid');

    if (!keyword) return;

    grid.innerHTML = '<div class="status-msg" style="color: var(--primary);">⏳ Đang kết nối thư viện PubMed...</div>';

    let query = `${keyword}`;
    if (modality) query += ` AND ${modality}`;

    try {
        // Bước 1: Lấy danh sách ID bài báo
        const searchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(query)}&retmode=json&retmax=12${NCBI_PARAMS}`;
        const searchRes = await fetch(searchUrl);
        
        if (!searchRes.ok) throw new Error("HTTP error " + searchRes.status);
        
        const searchData = await searchRes.json();
        const idList = searchData.esearchresult.idlist;

        if (!idList || idList.length === 0) {
            grid.innerHTML = '<p class="status-msg">Không tìm thấy bài báo nào phù hợp với từ khóa.</p>';
            return;
        }

        // Bước 2: Lấy thông tin tóm tắt bằng định dạng XML (Độ ổn định cao nhất từ NCBI)
        const fetchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=${idList.join(',')}&retmode=xml${NCBI_PARAMS}`;
        const fetchRes = await fetch(fetchUrl);
        const xmlText = await fetchRes.text();

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const articles = xmlDoc.querySelectorAll("PubmedArticle");

        articlesData = Array.from(articles).map(art => {
            const id = art.querySelector("PMID")?.textContent || "";
            const title = art.querySelector("ArticleTitle")?.textContent || "Không có tiêu đề";
            const journal = art.querySelector("Journal > Title")?.textContent || "PubMed";
            const pubDate = art.querySelector("JournalIssue > PubDate > Year")?.textContent || "N/A";
            
            // Lấy tóm tắt (Abstract)
            const abstractNodes = art.querySelectorAll("AbstractText");
            let abstractText = Array.from(abstractNodes).map(node => node.textContent).join(" ");
            if (!abstractText) abstractText = "Bài báo này không cung cấp sẵn Abstract công khai, vui lòng xem bài gốc tại PubMed.";

            // Lấy tác giả
            const authorNodes = art.querySelectorAll("Author");
            let authors = "N/A";
            if (authorNodes.length > 0) {
                const firstLastName = authorNodes[0].querySelector("LastName")?.textContent || "";
                authors = firstLastName ? `${firstLastName} et al.` : "N/A";
            }

            return {
                id: id,
                title: title,
                source: journal,
                pubdate: pubDate,
                authors: authors,
                abstract: abstractText
            };
        });

        renderArticles(articlesData);

    } catch (error) {
        console.error("Lỗi:", error);
        grid.innerHTML = '<p class="status-msg" style="color: #dc2626;">Lỗi kết nối API với PubMed. Vui lòng thử lại sau vài giây!</p>';
    }
}

function renderArticles(data) {
    const grid = document.getElementById('caseGrid');
    grid.innerHTML = '';

    data.forEach(item => {
        grid.innerHTML += `
            <div class="card" onclick="openModal('${item.id}')">
                <div>
                    <span class="badge">${item.source}</span>
                    <div class="card-title">${item.title}</div>
                </div>
                <div class="card-meta">🗓️ Năm: ${item.pubdate} | ✍️ ${item.authors}</div>
            </div>
        `;
    });
}

function openModal(id) {
    const item = articlesData.find(a => a.id === id);
    if (!item) return;

    document.getElementById('modalTitle').innerText = item.title;
    document.getElementById('modalJournal').innerText = item.source;
    document.getElementById('modalAuthors').innerText = 'Tác giả: ' + item.authors;
    document.getElementById('modalAbstract').innerText = item.abstract;
    document.getElementById('modalLink').href = `https://pubmed.ncbi.nlm.nih.gov/${id}/`;
    document.getElementById('caseModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('caseModal').style.display = 'none';
}

function handleKeyPress(e) {
    if (e.key === 'Enter') searchPubMed();
}

// Chạy tự động
searchPubMed();
</script>

</body>
</html>
